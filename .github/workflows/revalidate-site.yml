name: Revalidate getopenclip.app

# Manual rebuild trigger for getopenclip.app. Normal extension publishes are
# handled by openclip-web's sync-extensions workflow, which commits the updated
# catalog and icons to main and lets the push trigger Cloudflare. This workflow
# stays for a manual deploy that does not need a commit.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: revalidate-site
  cancel-in-progress: false

jobs:
  revalidate:
    runs-on: ubuntu-latest
    steps:
      - name: Call revalidate endpoint
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "::error::REVALIDATE_SECRET is not set"; exit 1
          fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $REVALIDATE_SECRET" \
            --retry 3 --retry-delay 10 --retry-all-errors \
            https://www.getopenclip.app/api/revalidate
