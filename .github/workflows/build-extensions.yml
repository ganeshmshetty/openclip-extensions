name: Build & Publish Extensions

# Creates versioned GitHub Releases (one per extension version) with the built
# zip as a release asset, so GitHub tracks download counts for free.
# Also commits the freshly-built .openclipext.zip files to published/.
on:
  push:
    branches: [main]
    paths:
      - 'raw/**'
      - '.github/workflows/build-extensions.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extensions-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "OpenClip Bot"
          git config user.email "actions@github.com"

      - name: Build zips and publish releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ROOT="$(pwd)"
          RAW_DIR="$ROOT/raw"
          BUILT=""
          CHANGED_ZIPS=""

          for pkg_dir in "$RAW_DIR"/*.openclipext; do
            [ -d "$pkg_dir" ] || continue
            pkg_name="$(basename "$pkg_dir")"                       # e.g. AppleMusic.openclipext
            manifest="$pkg_dir/openclip.json"
            [ -f "$manifest" ] || continue

            # Build the distributable zip from source.
            (cd "$RAW_DIR" && zip -r -X "$ROOT/published/$pkg_name.zip" "$pkg_name" -x '*.DS_Store' -x '._*' >/dev/null)

            version="$(jq -r '.version // "1.0.0"' "$manifest")"
            identifier="$(jq -r '.identifier // empty' "$manifest")"
            if [ -z "$identifier" ]; then
              identifier="com.openclip.${pkg_name%.openclipext}"
              identifier="$(echo "$identifier" | tr '[:upper:]' '[:lower:]')"
            fi
            tag="${identifier}@${version}"

            if gh release view "$tag" --json name >/dev/null 2>&1; then
              # Same version can be republished: overwrite the release asset in place, so content
              # changes reach users without a version bump or a new release tag.
              echo "Release $tag already exists; re-uploading $pkg_name.zip (clobber)."
              gh release upload "$tag" "$ROOT/published/$pkg_name.zip" --clobber --repo "$GITHUB_REPOSITORY"
              CHANGED_ZIPS="$CHANGED_ZIPS published/$pkg_name.zip"
              continue
            fi

            echo "Creating release $tag for $pkg_name..."
            gh release create "$tag" \
              "$ROOT/published/$pkg_name.zip" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$pkg_name v$version" \
              --notes "Release $pkg_name v$version built automatically from raw/$pkg_name."
            CHANGED_ZIPS="$CHANGED_ZIPS published/$pkg_name.zip"
          done

          # Commit rebuilt zips so they stay in sync with the raw source.
          if [ -n "$CHANGED_ZIPS" ]; then
            git add $CHANGED_ZIPS
            if ! git diff --cached --quiet; then
              git commit -m "build(extensions): rebuild .openclipext zips [skip ci]"
              # The stats workflow can land a commit between our checkout and push;
              # rebase and retry so a non-fast-forward doesn't drop this update.
              for attempt in 1 2 3; do
                if git push origin main 2>/dev/null; then
                  break
                fi
                echo "Push failed (attempt $attempt); rebasing and retrying..."
                git pull --rebase --autostash origin main
              done
              if [ "$(git rev-list --count origin/main..main)" -ne 0 ]; then
                echo "Push to main failed after 3 attempts"
                exit 1
              fi
            fi
          fi

      - name: Generate and commit catalog.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ROOT="$(pwd)"
          RAW_DIR="$ROOT/raw"

          # Build catalog.json from the raw extension manifests so the web API
          # serves metadata from a single file instead of walking the GitHub tree.
          CATALOG="$ROOT/published/catalog.json"
          jq -n '{updatedAt: (now | todateiso8601), extensions: []}' > "$CATALOG"

          for pkg_dir in "$RAW_DIR"/*.openclipext; do
            [ -d "$pkg_dir" ] || continue
            pkg_name="$(basename "$pkg_dir")"                       # e.g. AppleMusic.openclipext
            manifest="$pkg_dir/openclip.json"
            [ -f "$manifest" ] || continue

            identifier="$(jq -r '.identifier // empty' "$manifest")"
            if [ -z "$identifier" ]; then
              identifier="com.openclip.${pkg_name%.openclipext}"
              identifier="$(echo "$identifier" | tr '[:upper:]' '[:lower:]')"
            fi

            raw_icon="$(jq -r '(.action.icon // .actions[0].icon // "")' "$manifest")"
            if [[ "$raw_icon" =~ \.(svg|png|jpg|jpeg|icns|gif)$ ]]; then
              store_icon=""
            else
              store_icon="$raw_icon"
            fi

            entry=$(jq -nc \
              --arg id "$identifier" \
              --arg name "$(jq -r '.name // (.action.title // .actions[0].title // empty)' "$manifest")" \
              --arg desc "$(jq -r '.description // empty' "$manifest")" \
              --arg author "$(jq -r '.author // "OpenClip Team"' "$manifest")" \
              --arg icon "$store_icon" \
              --arg version "$(jq -r '.version // "1.0.0"' "$manifest")" \
              --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/${identifier}@$(jq -r '.version // "1.0.0"' "$manifest")/$pkg_name.zip" \
              '{id: $id, name: $name, description: $desc, author: $author, icon: $icon, version: $version, downloadCount: 0, downloadURL: $url}')

            jq --argjson entry "$entry" '.extensions += [$entry]' "$CATALOG" > "$CATALOG.tmp"
            mv "$CATALOG.tmp" "$CATALOG"
          done

          git add published/catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(extensions): regenerate catalog.json [skip ci]"
            for attempt in 1 2 3; do
              if git push origin main 2>/dev/null; then
                break
              fi
              echo "Push failed (attempt $attempt); rebasing and retrying..."
              git pull --rebase --autostash origin main
            done
            if [ "$(git rev-list --count origin/main..main)" -ne 0 ]; then
              echo "Push to main failed after 3 attempts"
              exit 1
            fi
          fi