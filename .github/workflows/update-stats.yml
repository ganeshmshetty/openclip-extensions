name: Update Extension Stats

# Nightly job that reads GitHub Release download counts and writes them into
# extension-stats.json (committed to the repo), following the Obsidian model.
on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC nightly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extensions-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect download counts
        id: collect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ROOT="$(pwd)"
          TMP="$(mktemp)"

          # All releases, paginated. Each release tag is "<identifier>@<version>"
          # and carries the built extension zip as an asset.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate > "$TMP"

          python3 - << 'EOF' "$TMP"
          import json, os, sys
          from datetime import datetime, timezone

          root = os.getcwd()
          stats_path = os.path.join(root, "published", "extension-stats.json")
          catalog_path = os.path.join(root, "published", "catalog.json")
          tmp_path = sys.argv[1]

          # Load existing stats (historical high-water marks)
          existing_downloads = {}
          if os.path.exists(stats_path):
              try:
                  with open(stats_path, "r", encoding="utf-8") as f:
                      data = json.load(f)
                      existing_downloads = data.get("downloads", {})
              except Exception as e:
                  print(f"Warning: could not parse existing stats: {e}", file=sys.stderr)

          # Load fetched releases
          try:
              with open(tmp_path, "r", encoding="utf-8") as f:
                  releases = json.load(f)
          except Exception as e:
              print(f"Error loading releases: {e}", file=sys.stderr)
              releases = []

          # Aggregate API download counts across all release tags
          api_downloads = {}
          for rel in releases:
              tag = rel.get("tag_name", "")
              if "@" not in tag:
                  continue
              identifier = tag.split("@")[0].strip().lower()
              assets = rel.get("assets", [])
              dl_for_rel = sum(
                  asset.get("download_count", 0)
                  for asset in assets
                  if asset.get("name", "").endswith(".zip")
              )
              api_downloads[identifier] = api_downloads.get(identifier, 0) + dl_for_rel

          # Enforce monotonic counts: max(api_count, historical_count)
          all_ids = set(existing_downloads.keys()) | set(api_downloads.keys())
          final_downloads = {}
          for ident in sorted(all_ids):
              prev = existing_downloads.get(ident, 0)
              api_val = api_downloads.get(ident, 0)
              final_downloads[ident] = max(prev, api_val)

          new_stats = {
              "updatedAt": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "downloads": final_downloads
          }

          with open(stats_path, "w", encoding="utf-8") as f:
              json.dump(new_stats, f, indent=2)
              f.write("\n")

          # Also update catalog.json downloadCount if catalog exists
          if os.path.exists(catalog_path):
              try:
                  with open(catalog_path, "r", encoding="utf-8") as f:
                      catalog = json.load(f)
                  for ext in catalog.get("extensions", []):
                      ext_id = ext.get("id", "").lower()
                      if ext_id in final_downloads:
                          ext["downloadCount"] = max(ext.get("downloadCount", 0), final_downloads[ext_id])
                  with open(catalog_path, "w", encoding="utf-8") as f:
                      json.dump(catalog, f, indent=2)
                      f.write("\n")
              except Exception as e:
                  print(f"Warning: could not update catalog: {e}", file=sys.stderr)

          print(f"Stats successfully updated for {len(final_downloads)} extensions.")
          EOF
          rm -f "$TMP"

      - name: Commit stats
        run: |
          git config user.name "OpenClip Bot"
          git config user.email "actions@github.com"
          git add published/extension-stats.json published/catalog.json
          if git diff --cached --quiet; then
            echo "No download count changes; skipping commit."
          else
            git commit -m "chore(extensions): update download stats [skip ci]"
            # The build workflow can land a commit between our checkout and push;
            # rebase and retry so a non-fast-forward doesn't drop tonight's stats.
            for attempt in 1 2 3; do
              if git push origin main 2>/dev/null; then
                break
              fi
              echo "Push failed (attempt $attempt); rebasing and retrying..."
              git pull --rebase --autostash origin main
            done
            if [ "$(git rev-list --count origin/main..main)" -ne 0 ]; then
              echo "Push to main failed after 3 attempts"
              exit 1
            fi
          fi
